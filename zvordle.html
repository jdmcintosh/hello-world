<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zvordle</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#fff; --surface:#fff; --border:#d3d6da; --text:#1a1a1b;
      --subtext:#787c7e; --correct:#6aaa64; --present:#c9b458; --absent:#787c7e;
      --key-bg:#d3d6da; --key-text:#1a1a1b; --hborder:#e0e0e0;
      --rbg:#f7f7f7; --cbg:#f7f7f7; --cborder:#e0e0e0;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#121213; --surface:#1a1a1b; --border:#3a3a3c; --text:#fff;
        --subtext:#818384; --correct:#538d4e; --present:#b59f3b; --absent:#3a3a3c;
        --key-bg:#818384; --key-text:#fff; --hborder:#3a3a3c;
        --rbg:#1a1a1b; --cbg:#1a1a1b; --cborder:#3a3a3c;
      }
    }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
    header { width:100%; max-width:500px; display:flex; justify-content:center; padding:12px 16px; border-bottom:1px solid var(--hborder); margin-bottom:8px; }
    header h1 { font-size:2rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .tab-bar { display:flex; border-bottom:2px solid var(--border); width:100%; max-width:500px; margin-bottom:16px; }
    .tab-btn { flex:1; padding:10px; background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px; cursor:pointer; font-size:.875rem; font-weight:600; color:var(--subtext); text-transform:uppercase; letter-spacing:.05em; transition:color .15s,border-color .15s; }
    .tab-btn.active { color:var(--text); border-bottom-color:var(--text); }
    .tab-panel { display:none; width:100%; max-width:500px; }
    .tab-panel.active { display:flex; flex-direction:column; align-items:center; }
    #board { display:grid; grid-template-rows:repeat(6,1fr); gap:5px; margin-bottom:20px; }
    .row { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
    .tile { width:62px; height:62px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700; text-transform:uppercase; color:var(--text); background:var(--surface); user-select:none; position:relative; }
    .tile[data-letter] { border-color:#878a8c; }
    .tile[data-state=correct]  { background:var(--correct); color:#fff; border-color:var(--correct); }
    .tile[data-state=present]  { background:var(--present); color:#fff; border-color:var(--present); }
    .tile[data-state=absent]   { background:var(--absent);  color:#fff; border-color:var(--absent); }
    .tile.pop { animation:pop .1s ease-in-out; }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
    .tile.flip { animation:flip .5s ease forwards; animation-delay:calc(var(--col,0)*.15s); }
    @keyframes flip { 0%{transform:rotateX(0)} 49%{transform:rotateX(-90deg)} 50%{transform:rotateX(-90deg)} 100%{transform:rotateX(0)} }
    .row.shake { animation:shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)} }
    .tile.bounce { animation:tbounce .5s ease forwards; animation-delay:calc(var(--col,0)*.08s); }
    @keyframes tbounce { 0%{transform:translateY(0)} 40%{transform:translateY(-20px)} 70%{transform:translateY(-8px)} 85%{transform:translateY(-14px)} 100%{transform:translateY(0)} }
    #toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:6px; font-size:.875rem; font-weight:600; pointer-events:none; opacity:0; transition:opacity .2s; z-index:100; white-space:nowrap; }
    #toast.show { opacity:1; }
    #keyboard { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; padding:0 8px; max-width:500px; }
    .kb-row { display:flex; gap:5px; justify-content:center; }
    .key { height:58px; min-width:43px; padding:0 4px; border:none; border-radius:4px; background:var(--key-bg); color:var(--key-text); font-size:.8rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none; transition:background .2s,color .2s; -webkit-tap-highlight-color:transparent; }
    .key.wide { min-width:65px; font-size:.72rem; }
    .key[data-state=correct] { background:var(--correct); color:#fff; }
    .key[data-state=present] { background:var(--present); color:#fff; }
    .key[data-state=absent]  { background:var(--absent);  color:#fff; }
    #result-panel { display:none; flex-direction:column; align-items:center; gap:12px; width:calc(100% - 32px); max-width:468px; background:var(--rbg); border:1px solid var(--border); border-radius:12px; padding:20px 24px; margin:20px 0; text-align:center; }
    #result-panel.show { display:flex; }
    #result-message { font-size:1rem; font-weight:600; color:var(--subtext); }
    #result-word { font-size:2.5rem; font-weight:800; letter-spacing:.15em; }
    .result-ipa { font-size:1.1rem; color:var(--subtext); display:block; }
    .result-phonetic { font-size:.85rem; color:var(--subtext); letter-spacing:.05em; display:block; margin-top:2px; }
    #result-example { font-size:.95rem; font-style:italic; line-height:1.5; }
    .result-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
    .btn { padding:10px 20px; border-radius:6px; border:none; font-size:.875rem; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.05em; }
    .btn:hover { opacity:.85; }
    .btn-primary   { background:var(--correct); color:#fff; }
    .btn-secondary { background:var(--key-bg); color:var(--key-text); }
    .btn-share     { background:#1d9bf0; color:#fff; }
    #tab-vocab { padding:0 16px 40px; }
    .vocab-header { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:16px; }
    .vocab-header h2 { font-size:1.1rem; font-weight:700; }
    .btn-danger { background:none; border:1px solid #cc0033; color:#cc0033; font-size:.75rem; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600; }
    .btn-danger:hover { background:#cc0033; color:#fff; }
    #vocab-list { width:100%; display:flex; flex-direction:column; gap:12px; }
    .flashcard { background:var(--cbg); border:1px solid var(--cborder); border-radius:10px; padding:16px 18px; display:grid; grid-template-columns:auto 1fr; column-gap:16px; row-gap:6px; }
    .fc-word { font-size:1.8rem; font-weight:800; letter-spacing:.1em; grid-column:1; grid-row:1/3; align-self:center; color:var(--correct); }
    .fc-pron { grid-column:2; grid-row:1; }
    .fc-ipa { font-size:.95rem; color:var(--subtext); }
    .fc-phonetic { font-size:.8rem; color:var(--subtext); display:block; }
    .fc-example { grid-column:1/-1; font-size:.9rem; font-style:italic; line-height:1.5; border-top:1px solid var(--cborder); padding-top:10px; margin-top:4px; }
    .fc-date { grid-column:1/-1; font-size:.75rem; color:var(--subtext); }
    .empty-state { color:var(--subtext); text-align:center; padding:40px 0; font-size:.95rem; line-height:1.6; }
    @media (max-width:500px) {
      header h1 { font-size:1.5rem; }
      .tile { width:52px; height:52px; font-size:1.6rem; }
      .key { height:50px; min-width:32px; font-size:.7rem; }
      .key.wide { min-width:48px; font-size:.62rem; }
      #result-word { font-size:2rem; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header><h1>Zvordle</h1></header>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="game">Play</button>
    <button class="tab-btn" data-tab="vocab">My Vocabulary</button>
  </div>
  <div id="tab-game" class="tab-panel active">
    <div id="board"></div>
    <div id="keyboard"></div>
    <div id="result-panel">
      <div id="result-message"></div>
      <div id="result-word"></div>
      <span id="result-ipa" class="result-ipa"></span>
      <span id="result-phonetic" class="result-phonetic"></span>
      <div id="result-example"></div>
      <div class="result-actions">
        <button class="btn btn-share"     id="btn-share">↗ Share</button>
        <button class="btn btn-secondary" id="btn-vocab">My Vocabulary</button>
        <button class="btn btn-primary"   id="btn-new">New Word</button>
      </div>
    </div>
  </div>
  <div id="tab-vocab" class="tab-panel">
    <div class="vocab-header">
      <h2>My Vocabulary</h2>
      <button class="btn-danger" id="btn-clear">Clear All</button>
    </div>
    <div id="vocab-list"></div>
  </div>
  <script>

  const SV = 'zvordle_vocab', SS = 'zvordle_state';
  const MAX = 6, LEN = 5;
  const PRI = {correct:3, present:2, absent:1, unused:0};
  let target, guesses=[], current='', over=false, keyStates={}, shareGrid=[];

  function rnd(ex){ const p=ex?WORDS.filter(w=>w.word!==ex):WORDS; return p[Math.floor(Math.random()*p.length)]; }

  function evaluate(guess,ans){
    const r=Array(LEN).fill('absent'), a=ans.split(''), g=guess.split('');
    g.forEach((l,i)=>{ if(l===a[i]){r[i]='correct';a[i]=null;g[i]=null;} });
    g.forEach((l,i)=>{ if(!l)return; const j=a.indexOf(l); if(j!==-1){r[i]='present';a[j]=null;} });
    return r;
  }

  function tile(r,c){ return document.getElementById('tile-'+r+'-'+c); }

  function buildBoard(){
    const b=document.getElementById('board'); b.innerHTML='';
    for(let r=0;r<MAX;r++){
      const row=document.createElement('div'); row.className='row'; row.id='row-'+r;
      for(let c=0;c<LEN;c++){
        const t=document.createElement('div'); t.className='tile'; t.id='tile-'+r+'-'+c;
        t.style.setProperty('--col',c); row.appendChild(t);
      }
      b.appendChild(row);
    }
  }

  function clearBoard(){
    for(let r=0;r<MAX;r++) for(let c=0;c<LEN;c++){
      const t=tile(r,c); t.textContent=''; delete t.dataset.letter; delete t.dataset.state;
    }
  }

  function buildKB(){
    const rows=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','⌫']];
    const kb=document.getElementById('keyboard'); kb.innerHTML='';
    rows.forEach(letters=>{
      const row=document.createElement('div'); row.className='kb-row';
      letters.forEach(l=>{
        const btn=document.createElement('button');
        btn.className='key'+(l.length>1?' wide':''); btn.textContent=l;
        if(l!=='ENTER'&&l!=='⌫') btn.dataset.key=l;
        row.appendChild(btn);
      });
      kb.appendChild(row);
    });
  }

  function syncKB(){
    document.querySelectorAll('.key[data-key]').forEach(k=>{
      const s=keyStates[k.dataset.key]; if(s) k.dataset.state=s; else delete k.dataset.state;
    });
  }

  function updKeys(guess,states){
    guess.split('').forEach((l,i)=>{
      const c=keyStates[l]||'unused'; if(PRI[states[i]]>PRI[c]) keyStates[l]=states[i];
    });
  }

  function addLetter(l){
    if(over||current.length>=LEN) return;
    current+=l; const t=tile(guesses.length,current.length-1);
    t.textContent=l; t.dataset.letter=l;
    t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  }

  function delLetter(){
    if(over||!current.length) return;
    const t=tile(guesses.length,current.length-1);
    t.textContent=''; delete t.dataset.letter; current=current.slice(0,-1);
  }

  function submit(){
    if(over) return;
    if(current.length!==LEN){ shake(guesses.length); toast('Not enough letters'); return; }
    const states=evaluate(current,target.word), row=guesses.length, guess=current;
    states.forEach((st,col)=>{
      const t=tile(row,col);
      setTimeout(()=>{ t.dataset.state=st; }, col*150+250);
      t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip');
    });
    guesses.push(guess); current=''; updKeys(guess,states);
    shareGrid.push(states.map(s=>s==='correct'?'🟩':s==='present'?'🟨':'⬜').join(''));
    setTimeout(()=>{
      syncKB(); saveState();
      if(guess===target.word){ over=true; bounce(row); setTimeout(showResult,500); }
      else if(guesses.length>=MAX){ over=true; setTimeout(showResult,300); }
    }, (LEN-1)*150+600);
  }

  function shake(r){ const row=document.getElementById('row-'+r); row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }
  function bounce(r){ for(let c=0;c<LEN;c++){ const t=tile(r,c); t.classList.remove('bounce'); void t.offsetWidth; t.classList.add('bounce'); } }

  let tt;
  function toast(msg,ms=1600){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),ms); }

  function showResult(){
    const won=guesses[guesses.length-1]===target.word;
    const msgs=['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
    document.getElementById('result-message').textContent = won ? msgs[Math.min(guesses.length-1,5)] : 'The word was';
    document.getElementById('result-word').textContent    = target.word;
    document.getElementById('result-ipa').textContent     = target.ipa;
    document.getElementById('result-phonetic').textContent= target.phonetic;
    document.getElementById('result-example').textContent = '“'+target.example+'”';
    document.getElementById('result-panel').classList.add('show');
    saveVocab(target);
  }

  function shareText(){
    const won=guesses[guesses.length-1]===target.word;
    return ['Zvordle '+(won?guesses.length:'X')+'/'+MAX,'', ...shareGrid].join('
');
  }

  document.getElementById('btn-share').addEventListener('click',()=>{
    const txt=shareText();
    if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('Copied!')); }
    else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('Copied!'); }
  });
  document.getElementById('btn-new').addEventListener('click', newGame);
  document.getElementById('btn-vocab').addEventListener('click', ()=>switchTab('vocab'));

  function saveVocab(e){
    const v=JSON.parse(localStorage.getItem(SV)||'[]');
    if(!v.some(x=>x.word===e.word)){ v.push({...e,learnedOn:new Date().toISOString()}); localStorage.setItem(SV,JSON.stringify(v)); }
  }

  function renderVocab(){
    const v=JSON.parse(localStorage.getItem(SV)||'[]');
    const el=document.getElementById('vocab-list');
    if(!v.length){ el.innerHTML='<p class="empty-state">Complete a puzzle to start building your vocabulary.<br>Words appear here after each game.</p>'; return; }
    el.innerHTML=v.slice().reverse().map(e=>
      '<div class="flashcard">'+
        '<div class="fc-word">'+e.word+'</div>'+
        '<div class="fc-pron"><span class="fc-ipa">'+e.ipa+'</span><span class="fc-phonetic">'+e.phonetic+'</span></div>'+
        '<div class="fc-example">“'+e.example+'”</div>'+
        '<div class="fc-date">Learned '+new Date(e.learnedOn).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})+'</div>'+
      '</div>'
    ).join('');
  }

  document.getElementById('btn-clear').addEventListener('click',()=>{
    if(confirm('Clear your entire vocabulary? This cannot be undone.')){ localStorage.removeItem(SV); renderVocab(); toast('Vocabulary cleared'); }
  });

  function saveState(){
    const won=guesses.length&&guesses[guesses.length-1]===target.word;
    localStorage.setItem(SS,JSON.stringify({word:target.word,guesses,status:won?'won':guesses.length>=MAX?'lost':'playing'}));
  }

  function loadGame(){
    const raw=localStorage.getItem(SS);
    if(raw){
      try{
        const s=JSON.parse(raw), entry=WORDS.find(w=>w.word===s.word);
        if(entry){
          target=entry; guesses=s.guesses||[];
          guesses.forEach((g,row)=>{
            const states=evaluate(g,target.word);
            states.forEach((st,col)=>{ const t=tile(row,col); t.textContent=g[col]; t.dataset.letter=g[col]; t.dataset.state=st; });
            updKeys(g,states);
          });
          shareGrid=guesses.map(g=>evaluate(g,target.word).map(s=>s==='correct'?'🟩':s==='present'?'🟨':'⬜').join(''));
          syncKB();
          if(s.status!=='playing'){ over=true; showResult(); return; }
          return;
        }
      }catch(e){}
    }
    target=rnd(); guesses=[]; saveState();
  }

  function newGame(){
    const prev=target?target.word:null;
    target=rnd(prev); guesses=[]; current=''; over=false; keyStates={}; shareGrid=[];
    clearBoard(); syncKB(); document.getElementById('result-panel').classList.remove('show');
    saveState();
  }

  function switchTab(name){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
    if(name==='vocab') renderVocab();
  }

  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  document.getElementById('keyboard').addEventListener('click',e=>{
    const b=e.target.closest('.key'); if(!b) return;
    const l=b.textContent;
    if(l==='ENTER') submit(); else if(l==='⌫') delLetter(); else addLetter(l);
  });
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(!document.querySelector('#tab-game.active')) return;
    if(e.key==='Enter') submit();
    else if(e.key==='Backspace') delLetter();
    else if(/^[a-zA-Z]$/.test(e.key)) addLetter(e.key.toUpperCase());
  });

  buildBoard(); buildKB(); loadGame();
  </script>
</body>
</html>
